name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.8.0)"
        required: true
        type: string
      create_tag:
        description: "Create new tag on current commit (uncheck to use existing tag)"
        required: true
        type: boolean
        default: true

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      VERSION: ${{ inputs.version }}

    steps:
      # ── Validate ───────────────────────────────────────────
      - name: Validate version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi

          # Refuse versions lower than the current Latest release: Sparkle
          # compares build numbers (run numbers), so an older version published
          # as Latest would be offered to everyone as an "update".
          if OUT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>&1); then
            LATEST=${OUT#v}
          elif [[ $OUT == *"Not Found"* ]]; then
            LATEST=""
          else
            echo "Could not read the latest release: $OUT"
            exit 1
          fi

          if [[ -n "$LATEST" && "$LATEST" != "$VERSION" ]]; then
            LOWER=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -t. -k1,1n -k2,2n -k3,3n | sed -n 1p)
            if [[ "$LOWER" == "$VERSION" ]]; then
              echo "Version $VERSION is lower than the latest release $LATEST"
              exit 1
            fi
          fi
          echo "Version $VERSION OK (latest release: ${LATEST:-none})"

      # ── Tag ────────────────────────────────────────────────
      - name: Create tag
        if: inputs.create_tag
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/v${process.env.VERSION}`,
              sha: context.sha,
            });

      # ── Checkout ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ inputs.version }}
          # Full history so the tag check below can see origin/GhostCode.
          fetch-depth: 0
          # Keep the contents:write token out of .git/config during the build;
          # the gh steps authenticate with GH_TOKEN.
          persist-credentials: false

      # An existing tag may have moved since it was cut: only build it if it is
      # the dispatched commit or already on GhostCode.
      - name: Verify tag commit
        if: ${{ !inputs.create_tag }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse HEAD)
          echo "Building v${VERSION} at ${TAG_SHA} (dispatched at ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TAG_SHA" == "$GITHUB_SHA" ]]; then
            exit 0
          fi
          if git merge-base --is-ancestor "$TAG_SHA" origin/GhostCode; then
            exit 0
          fi
          echo "v${VERSION} points to ${TAG_SHA}, which is neither the dispatched commit nor on GhostCode"
          exit 1

      # ── Zig ────────────────────────────────────────────────
      - name: Install Zig
        run: |
          set -euo pipefail
          ZIG_SHA256=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar xJf "$RUNNER_TEMP/zig.tar.xz"
          echo "$PWD/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build XCFramework
        working-directory: Ghostty
        run: zig build -Demit-xcframework -Demit-macos-app=false -Doptimize=ReleaseFast

      # A re-run of a published version keeps its build number, so Sparkle
      # doesn't offer that same version again to users who already have it.
      - name: Choose build number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREVIOUS="$RUNNER_TEMP/previous-appcast.xml"
          # Only a release whose appcast was published can have reached users.
          if gh release view "v${VERSION}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx appcast.xml; then
            gh release download "v${VERSION}" --pattern appcast.xml --output "$PREVIOUS"
          fi
          BUILD_NUMBER=$(GhostCode/scripts/release-build-number.sh "$GITHUB_RUN_NUMBER" "$PREVIOUS")
          echo "Build number: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # ── Keychain & Signing ─────────────────────────────────
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          echo -n "$P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          rm -f "$CERTIFICATE_PATH"

      - name: Write App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$API_KEY_P8" | base64 --decode -o ~/private_keys/"AuthKey_${API_KEY_ID}.p8"

      # ── Build ──────────────────────────────────────────────
      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Ghostty/macos/Ghostty.xcodeproj \
            -scheme Ghostty \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/GhostCode.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            GHOSTCODE_UPDATES_ENABLED=YES \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            DEVELOPMENT_TEAM=F548563X8C

      - name: Export
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GhostCode.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist GhostCode/ExportOptions.plist

      # ── Notarize ───────────────────────────────────────────
      - name: Create ZIP for notarization
        run: |
          set -euo pipefail
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent \
            "$RUNNER_TEMP/export/GhostCode.app" \
            "$RUNNER_TEMP/GhostCode-notarize.zip"

      - name: Notarize
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/GhostCode-notarize.zip" \
            --key ~/private_keys/"AuthKey_${API_KEY_ID}.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait

      - name: Staple
        run: xcrun stapler staple "$RUNNER_TEMP/export/GhostCode.app"

      # ── Package & Release ──────────────────────────────────
      - name: Create release ZIP
        run: |
          set -euo pipefail
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent \
            "$RUNNER_TEMP/export/GhostCode.app" \
            "$RUNNER_TEMP/GhostCode-${VERSION}-universal.zip"

      # ── Sparkle ────────────────────────────────────────────
      - name: Verify release ZIP
        run: GhostCode/scripts/verify-zip.sh "$RUNNER_TEMP/GhostCode-${VERSION}-universal.zip"

      - name: Sign update and write appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "SPARKLE_ED_PRIVATE_KEY secret is missing"; exit 1; }
          ZIP="$RUNNER_TEMP/GhostCode-${VERSION}-universal.zip"
          PLIST="$RUNNER_TEMP/export/GhostCode.app/Contents/Info.plist"
          SIGN_UPDATE="$RUNNER_TEMP/spm/artifacts/sparkle/Sparkle/bin/sign_update"
          test -x "$SIGN_UPDATE" || { echo "sign_update not found at $SIGN_UPDATE"; exit 1; }

          ATTRS=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$ZIP")
          SIG=$(printf '%s' "$ATTRS" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          PUB=$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$PLIST")
          swift GhostCode/scripts/verify-ed-signature.swift "$ZIP" "$SIG" "$PUB"

          ENABLED=$(/usr/libexec/PlistBuddy -c 'Print GhostCodeUpdatesEnabled' "$PLIST")
          test "$ENABLED" = "YES" || { echo "GhostCodeUpdatesEnabled is '$ENABLED', expected YES"; exit 1; }

          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$PLIST")
          APPCAST="$RUNNER_TEMP/appcast.xml"
          # No notes in the feed: they are written on the GitHub release after publishing.
          GhostCode/scripts/make-appcast.sh "$VERSION" "$BUILD" "$MIN_OS" "$ATTRS" > "$APPCAST"
          xmllint --noout "$APPCAST"

          # Sign the feed itself (the app sets SURequireSignedFeed), then verify it.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$APPCAST"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --verify --ed-key-file - "$APPCAST"
          xmllint --noout "$APPCAST"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/GhostCode-${VERSION}-universal.zip"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            # Re-run for an existing release: replace the zip, then the appcast.
            # The body is left alone: it holds the notes written by hand.
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            gh release create "v${VERSION}" "$ZIP" \
              --title "GhostCode v${VERSION}" \
              --generate-notes \
              --latest
          fi
          # The appcast goes last, so the feed never points at a missing zip.
          gh release upload "v${VERSION}" "$RUNNER_TEMP/appcast.xml" --clobber

      # ── Cleanup ────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/private_keys
          security delete-keychain "$RUNNER_TEMP/build.keychain-db"
